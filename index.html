<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ぽよRUSH</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#fff}
body{display:grid;place-items:center}.game{position:relative;width:min(100vw,56.25dvh);height:min(100dvh,177.78vw);overflow:hidden;background:#05020b}
.stage{position:absolute;inset:0 0 54% 0;overflow:hidden;background:radial-gradient(circle at 50% 45%,#4d174f 0,#170923 42%,#050611 100%)}
.sky{position:absolute;inset:0;background:radial-gradient(circle at 50% 18%,#d9e9ff 0 2.5%,#4164b9 2.7%,transparent 5%),linear-gradient(#071532,#26103b 60%,#4d163b);animation:sky 8s ease-in-out infinite alternate}
@keyframes sky{to{filter:hue-rotate(12deg) brightness(1.15);transform:scale(1.035)}}
.torii{position:absolute;left:24%;right:24%;bottom:3%;height:46%;opacity:.5;filter:drop-shadow(0 0 14px #ff4a98)}
.torii:before,.torii:after{content:"";position:absolute;background:#8b173e}.torii:before{left:18%;right:18%;top:12%;height:8%;box-shadow:0 -16px 0 #a7204b}.torii:after{left:27%;width:10%;top:17%;bottom:0;box-shadow:130px 0 0 #8b173e}
.glow{position:absolute;width:28%;aspect-ratio:1;border-radius:50%;background:#ff4eb333;filter:blur(28px);animation:float 5s ease-in-out infinite alternate}.g1{left:-5%;top:24%}.g2{right:-5%;top:15%;animation-delay:-2s}@keyframes float{to{transform:translateY(35px) scale(1.25)}}
.petals{position:absolute;inset:0;pointer-events:none}.petal{position:absolute;top:-5%;width:9px;height:14px;border-radius:100% 0;background:#ffc4e3;box-shadow:0 0 7px #fff;animation:fall linear forwards}@keyframes fall{to{transform:translate(var(--dx),52vh) rotate(650deg);opacity:.1}}
.fx{position:absolute;inset:0;pointer-events:none}.beam{position:absolute;left:-30%;top:48%;width:160%;height:8%;opacity:0;background:linear-gradient(90deg,transparent,#fff,#ff39ba,#fff,transparent);filter:blur(5px);transform:rotate(-8deg)}.beam.on{animation:beam .55s}@keyframes beam{20%{opacity:1}100%{opacity:0;transform:translateX(55%) rotate(-8deg)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0}.flash.on{animation:flash .35s}@keyframes flash{25%{opacity:.9}100%{opacity:0}}
.machine{position:absolute;left:2.5%;right:2.5%;top:43%;height:55%;border:2px solid #ff9edb;border-radius:24px;background:linear-gradient(#351037,#09010d 42%,#17051b);box-shadow:0 0 22px #ff34b7,inset 0 0 25px #a51b7a;overflow:hidden}
.reels{position:absolute;left:4%;right:4%;top:5%;height:47%;display:grid;grid-template-columns:repeat(3,1fr);gap:2.5%}.reel{overflow:hidden;border:2px solid #d790ff;border-radius:14px;background:#030006;box-shadow:inset 0 0 15px #000}.strip{height:400%;display:flex;flex-direction:column;transform:translateY(-100%)}.strip img{width:100%;height:25%;object-fit:cover}.reel.spin .strip{animation:roll .34s linear infinite}@keyframes roll{to{transform:translateY(0)}}.reel.stop{animation:kick .18s}@keyframes kick{50%{transform:translateY(5px)}}
.holdViewport{position:absolute;left:7%;right:7%;top:55%;height:13%;overflow:hidden;border-radius:999px;background:#09010dcc;border:1px solid #ff72c466;box-shadow:inset 0 0 15px #ff42b744}.holdTrack{height:100%;display:flex;align-items:center;gap:5%;padding-left:3%;transition:transform .42s cubic-bezier(.15,.8,.2,1)}.holdTrack.move{transform:translateX(-22%)}.hold{flex:0 0 17%;height:90%;object-fit:contain;filter:drop-shadow(0 0 7px #fff7)}.hold.current{animation:pulse .38s infinite alternate}@keyframes pulse{to{transform:scale(1.15);filter:drop-shadow(0 0 13px #fff) brightness(1.25)}}
.push{position:absolute;left:27%;top:70%;width:46%;height:16%;border-radius:50%;border:3px solid #fff;background:radial-gradient(ellipse,#fff 0 5%,#ff8bd8 15%,#ef169f 48%,#650044 75%);box-shadow:0 0 18px #fff,0 0 36px #ff19ad;color:#fff;font-size:clamp(25px,8vw,42px);font-weight:1000;text-shadow:0 2px 3px #72004a}.push.ready{animation:pp .55s infinite alternate}@keyframes pp{to{transform:scale(1.035);filter:brightness(1.25)}}.push.hot{animation:hot .18s infinite alternate}@keyframes hot{to{transform:scale(1.08);filter:brightness(1.6);box-shadow:0 0 30px #fff,0 0 55px #ff194f}}
.stats{position:absolute;left:3%;right:3%;bottom:2%;height:9%;display:grid;grid-template-columns:repeat(3,1fr);gap:2%}.stat{border:1px solid #bb4d9e;border-radius:12px;background:#0b0210;display:grid;place-items:center;font-weight:1000;font-size:clamp(17px,5vw,27px);position:relative}.stat small{position:absolute;top:4px;font-size:9px;color:#e78fc9}
.shake{animation:shake .28s linear 2}@keyframes shake{25%{transform:translate(-5px,2px)}50%{transform:translate(5px,-3px)}75%{transform:translate(-3px,-1px)}}
.result{position:absolute;z-index:30;inset:0;display:none;place-items:center;background:#070109ed;text-align:center}.result.on{display:grid}.card{width:80%;padding:25px;border:2px solid #ffc2eb;border-radius:22px;background:#19051f}.big{font-size:52px;font-weight:1000}.again{padding:13px 26px;border-radius:99px;border:1px solid white;background:#d81792;color:#fff;font-size:19px;font-weight:900}
</style></head><body><main class="game">
<section class="stage"><div class="sky"></div><div class="torii"></div><div class="glow g1"></div><div class="glow g2"></div><div class="petals"></div><div class="fx"><div class="beam"></div><div class="flash"></div></div></section>
<section class="machine"><div class="reels"><div class="reel"></div><div class="reel"></div><div class="reel"></div></div><div class="holdViewport"><div class="holdTrack"></div></div><button class="push ready" id="push">PUSH</button><div class="stats"><div class="stat"><small>残り</small><span id="remain">35</span></div><div class="stat"><small>連</small><span id="hits">0</span></div><div class="stat"><small>TOTAL</small><span id="total">0発</span></div></div></section>
<div class="result"><div class="card"><h1>RESULT</h1><div class="big" id="rt">0発</div><p id="ri"></p><button class="again" id="again">もう一度</button></div></div>
</main><script>

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let remain=35,hits=0,total=0,c240=0,c800=0,upper=false,locked=false,AC;
const vals=["1","3","7"],rates={white:.0024,blue:.15,green:.35,red:.60,gold:.85,rainbow:1,char_ars:.80,char_sara:.80};
function au(){return AC||(AC=new(window.AudioContext||window.webkitAudioContext)())}
function unlock(){try{let a=au();if(a.state==="suspended")a.resume();let b=a.createBuffer(1,1,a.sampleRate),x=a.createBufferSource(),g=a.createGain();g.gain.value=.00001;x.buffer=b;x.connect(g);g.connect(a.destination);x.start()}catch(e){}}
function tone(f,d=.1,v=.03,delay=0,type="sine"){try{let a=au(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d)}catch(e){}}
function alertSound(){try{let a=au(),n=a.currentTime,m=a.createGain(),c=a.createDynamicsCompressor();m.gain.value=.8;m.connect(c);c.connect(a.destination);let o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.setValueAtTime(180,n);o.frequency.exponentialRampToValueAtTime(60,n+.08);g.gain.setValueAtTime(.22,n);g.gain.exponentialRampToValueAtTime(.001,n+.1);o.connect(g);g.connect(m);o.start(n);o.stop(n+.11);[[500,3900],[700,5200]].forEach(([a1,a2],i)=>{let q=a.createOscillator(),h=a.createGain(),t=n+i*.018;q.type=i?"triangle":"sawtooth";q.frequency.setValueAtTime(a1,t);q.frequency.exponentialRampToValueAtTime(a2,t+.18);h.gain.setValueAtTime(.11-i*.025,t);h.gain.exponentialRampToValueAtTime(.001,t+.34);q.connect(h);h.connect(m);q.start(t);q.stop(t+.35)});[3400,4700,6100].forEach((f,i)=>tone(f,.32,.045,.12+i*.018,"sine"))}catch(e){}}
function beam(){let e=$(".beam");e.classList.remove("on");void e.offsetWidth;e.classList.add("on")}function flash(){let e=$(".flash");e.classList.remove("on");void e.offsetWidth;e.classList.add("on")}function shake(){let e=$(".game");e.classList.remove("shake");void e.offsetWidth;e.classList.add("shake");setTimeout(()=>e.classList.remove("shake"),600)}
function petal(){let e=document.createElement("i");e.className="petal";e.style.left=Math.random()*100+"%";e.style.animationDuration=(3.5+Math.random()*4)+"s";e.style.setProperty("--dx",(Math.random()*160-80)+"px");$(".petals").append(e);setTimeout(()=>e.remove(),8000)}setInterval(petal,280);
function reelStrip(el,start="3"){let order=[start,...vals,...vals];el.innerHTML='<div class="strip">'+order.map(v=>`<img src="${REEL[v]}">`).join("")+"</div>"}
$$(".reel").forEach((e,i)=>reelStrip(e,["3","1","7"][i]));
function stopReel(el,v,delay){setTimeout(()=>{el.classList.remove("spin");reelStrip(el,v);el.classList.add("stop");tone(110,.06,.05,0,"square");setTimeout(()=>el.classList.remove("stop"),200)},delay)}
function rollHold(){let r=Math.random(),type=r<.0025?"rainbow":r<.006?"char_ars":r<.0095?"char_sara":r<.016?"gold":r<.028?"red":r<.050?"green":r<.080?"blue":"white";return{type}}
let holdQ=[rollHold(),rollHold(),rollHold(),rollHold(),rollHold()];
function drawHolds(){let t=$(".holdTrack");t.classList.remove("move");t.innerHTML="";holdQ.forEach((h,i)=>{let e=new Image();e.className="hold "+(i===0?"current":"");e.src=HOLD_IMG[h.type];t.append(e)})}
function consume(){return new Promise(res=>{let cur=holdQ[0],t=$(".holdTrack");requestAnimationFrame(()=>t.classList.add("move"));setTimeout(()=>{holdQ.shift();holdQ.push(rollHold());drawHolds();res({type:cur.type,hit:Math.random()<rates[cur.type]})},430)})}
function upd(){$("#remain").textContent=remain;$("#hits").textContent=hits;$("#total").textContent=total+"発"}
async function spin(){if(locked)return;locked=true;remain--;upd();$("#push").classList.remove("ready");let c=await consume(),hit=c.hit,p={white:0,blue:1,green:2,red:3,gold:4,rainbow:5,char_ars:4,char_sara:4}[c.type]||0,pre=hit?Math.random()<.5:Math.random()<.000294,reach=hit||p>=2||Math.random()<.1,hot=hit||p>=3;
$$(".reel").forEach(e=>e.classList.add("spin"));if(pre)setTimeout(()=>{alertSound();flash();beam();shake();navigator.vibrate?.([80,20,120])},70);if(reach)setTimeout(()=>{beam();tone(120,.35,.035,0,"sawtooth")},550);if(hot)setTimeout(()=>{$("#push").classList.add("hot");shake()},1050);
let fin=hit?["7","7","7"]:[vals[Math.random()*3|0],vals[Math.random()*3|0],vals[Math.random()*3|0]];if(!hit&&fin[0]===fin[1]&&fin[1]===fin[2])fin[2]=fin[2]==="7"?"1":"7";let d=hot?2050:reach?1400:720;setTimeout(()=>{let rr=$$(".reel");stopReel(rr[0],fin[0],0);stopReel(rr[1],fin[1],210);stopReel(rr[2],fin[2],420)},d);setTimeout(()=>{$("#push").classList.remove("hot");if(hit){flash();beam();shake();let pay=Math.random()<1/3?240:800;hits++;total+=pay;pay===240?c240++:c800++;if(!upper&&Math.random()<.15){upper=true;remain=80;setTimeout(()=>{flash();beam();shake()},700)}else remain=upper?80:35;upd();setTimeout(()=>{locked=false;$("#push").classList.add("ready")},900)}else if(remain<=0){$("#rt").textContent=total+"発";$("#ri").textContent=`${hits}連　240発×${c240} / 800発×${c800}`;$(".result").classList.add("on")}else{locked=false;$("#push").classList.add("ready")}},d+700)}
function reset(){remain=35;hits=total=c240=c800=0;upper=locked=false;holdQ=[rollHold(),rollHold(),rollHold(),rollHold(),rollHold()];drawHolds();upd();$(".result").classList.remove("on");$("#push").classList.add("ready")}
let b=$("#push");b.addEventListener("pointerdown",unlock,{passive:true});b.addEventListener("touchstart",unlock,{passive:true});b.addEventListener("click",e=>{e.preventDefault();unlock();tone(180,.035,.018,0,"square");spin()});$("#again").onclick=reset;drawHolds();upd();
</script></body></html>
