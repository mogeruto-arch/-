<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>REMINISCENCE</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#030304;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
.m{max-width:620px;margin:auto;min-height:100vh;padding:10px;background:radial-gradient(circle at 50% 0,#3a0710,#080709 34%,#030304 100%)}
.top{height:92px;border:2px solid #503039;border-radius:9px;background:#0b080a;display:flex;align-items:center;justify-content:space-between;padding:10px 15px}.ttl{font-weight:1000;font-size:25px;letter-spacing:.08em;text-shadow:0 0 10px #d31c32}.ttl small{display:block;font-size:11px;color:#aaa;letter-spacing:.25em}.remain{font-size:13px;color:#aaa;text-align:right}.remain b{font-size:29px;color:#ff324b}
.case{margin-top:8px;border:7px solid #28272b;border-radius:9px;background:#050505;padding:5px;box-shadow:inset 0 0 20px #000,0 4px 16px #000;position:relative}.reels{height:300px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;overflow:hidden}.reel{overflow:hidden;position:relative;background:#f1e8e1;border:2px solid #252426}.strip{position:absolute;left:0;width:100%;will-change:transform}.cell{height:100px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid #c6bdb7;background:#f3e8e1}.cell img{width:100%;height:96px;object-fit:contain;mix-blend-mode:multiply}
.pay{position:absolute;left:5px;right:5px;top:50%;height:100px;transform:translateY(-50%);border-top:2px solid #b5192c;border-bottom:2px solid #b5192c;z-index:4;pointer-events:none;box-shadow:0 0 8px #c21c31}
.status{height:57px;margin:8px 0;border:1px solid #493038;border-radius:7px;background:#0b090a;display:flex;align-items:center;justify-content:center;flex-direction:column}#role{font-size:18px;font-weight:900}#detail{font-size:11px;color:#aaa;margin-top:3px}
.stops{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:3px 28px}.stop{aspect-ratio:1;border-radius:50%;border:6px solid #67676a;background:radial-gradient(circle,#ff5360 0 43%,#b00d1c 47% 69%,#45050b 72%);color:white;font-size:13px;font-weight:1000;box-shadow:0 5px 0 #191919,0 0 13px #d11b30}.stop:disabled{opacity:.42;filter:grayscale(1)}.lever{width:100%;height:60px;margin-top:10px;border:2px solid #77202d;border-radius:10px;background:linear-gradient(#711522,#2d080d);color:#fff;font-size:21px;font-weight:1000;box-shadow:0 4px 0 #130204}.lever:disabled{opacity:.45}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px;text-align:center;font-size:10px;color:#aaa}.stats b{display:block;font-size:17px;color:white}
.ov{position:fixed;inset:0;display:none;z-index:50;background:#000;align-items:center;justify-content:center;flex-direction:column;text-align:center}.ov.on{display:flex}#fr.on{animation:flash .09s steps(2) 9}#fr strong{font-size:55px;color:#e91e38;text-shadow:0 0 30px #f22}#win img{width:100%;height:100%;object-fit:cover}#win b{position:absolute;bottom:8%;font-size:32px;text-shadow:0 3px 15px #000}@keyframes flash{50%{background:#52000c;filter:brightness(2)}}
@media(max-width:430px){.m{padding:6px}.reels{height:270px}.cell{height:90px}.cell img{height:87px}.pay{height:90px}.stops{padding:3px 14px}}
</style></head><body>

const H=100; R.forEach((a,i)=>{document.getElementById('r'+i).innerHTML=a.concat(a,a).map(x=>`<div class="cell"><img src="${IMG[x]}"></div>`).join('')});
function sound(k){try{let a=new Audio(SND[k]);a.volume=.75;a.play()}catch(e){}}
let g=0,active=false,spinning=false,stopped=[1,1,1],timers=[],target=[0,0,0],roleNow='',hit=false,freezeAt=99,T=0,W=0,stopN=0;
function pos(i,n,anim){let e=document.getElementById('r'+i),v=document.querySelector('.reels').clientHeight,h=innerWidth<=430?90:100,y=v/2-h/2-(n+20)*h;e.style.transition=anim?'transform .25s cubic-bezier(.08,.8,.18,1)':'none';e.style.transform=`translateY(${y}px)`}[0,1,2].forEach(i=>pos(i,7,false));
const P={diag:1/131.1,wc:1/70.3,sw:1/100.5,ca:2/585.1,sc:1/356.2,push:.625};
function draw(){let r=Math.random(),c=0,a=[['チャンス目',P.ca],['強チェリー',P.sc],['弱チェリー',P.wc],['スイカ',P.sw],['斜めベル',P.diag],['押し順ベル',P.push]];for(let x of a){c+=x[1];if(r<c)return x[0]}return'リプレイ'}
function hp(x){if(x==='チャンス目'||x==='強チェリー')return 1;if(x==='弱チェリー'||x==='スイカ')return g===8?1:.4061;if(x.includes('ベル'))return .1094;return .0005}
function ids(a,x){return a.map((v,i)=>v===x?i:-1).filter(i=>i>=0)}function pick(a){return a[Math.floor(Math.random()*a.length)]}
function mk(x){if(x==='リプレイ')return R.map(a=>pick(ids(a,'replay')));if(x.includes('ベル'))return R.map(a=>pick(ids(a,'bell')));if(x.includes('チェリー'))return[pick(ids(R[0],'cherry')),pick(ids(R[1],'kaku')),pick(ids(R[2],'kaku'))];if(x==='スイカ')return R.map(a=>pick(ids(a,'watermelon')));return[pick(ids(R[0],'ghoul')),pick(ids(R[1],'kaku')),pick(ids(R[2],'kaku'))]}
function upd(){tries.textContent=T;wins.textContent=W;rate.textContent=T?(W/T*100).toFixed(1)+'%':'--'}
lever.onclick=()=>{if(spinning)return;sound('lever');if(!active){active=true;g=0;T++}g++;rem.textContent=8-g;roleNow=draw();hit=Math.random()<hp(roleNow);freezeAt=hit?1+Math.floor(Math.random()*3):99;target=mk(roleNow);stopped=[0,0,0];stopN=0;spinning=true;lever.disabled=true;role.textContent='回転中…';detail.textContent='STOPボタンを押せ';[0,1,2].forEach(i=>{b=document.getElementById('b'+i);b.disabled=false;let n=Math.floor(Math.random()*20);timers[i]=setInterval(()=>{n=(n+1)%20;pos(i,n,false)},42)});upd()};
function stop(i){if(!spinning||stopped[i])return;sound('stop');clearInterval(timers[i]);stopped[i]=1;stopN++;pos(i,target[i],true);document.getElementById('b'+i).disabled=true;if(hit&&stopN===freezeAt){setTimeout(()=>winNow(stopN),260);return}if(stopped.every(Boolean))setTimeout(resolve,280)}[0,1,2].forEach(i=>document.getElementById('b'+i).onclick=()=>stop(i));
function resolve(){spinning=false;lever.disabled=false;role.textContent=roleNow;detail.textContent=`AT抽選 ${(hp(roleNow)*100).toFixed(2)}% → 非当選`;if(g===8){active=false;detail.textContent='レミニセンス失敗　次のレバーで再挑戦'}upd()}
function winNow(n){spinning=false;timers.forEach(clearInterval);[0,1,2].forEach(i=>document.getElementById('b'+i).disabled=true);W++;active=false;upd();sound('freeze');fst.textContent=n===1?'第一停止フリーズ':n===2?'第二停止フリーズ':'第三停止フリーズ';fr.classList.add('on');setTimeout(()=>{fr.classList.remove('on');sound('hit');win.classList.add('on')},1150);setTimeout(()=>{win.classList.remove('on');role.textContent='AT 当選';detail.textContent='次のレバーONで再挑戦';lever.disabled=false},3500)}
upd();
</script></body></html>
