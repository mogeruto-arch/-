<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>REMINISCENCE SLOT</title><style>
*{box-sizing:border-box}body{margin:0;background:#050506;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.wrap{max-width:520px;margin:auto;padding:12px}.cab{background:linear-gradient(90deg,#18191b,#3b3d41,#17181a);border:3px solid #555;border-radius:22px;padding:12px;box-shadow:0 15px 45px #000}.logo{text-align:center;font-size:27px;font-weight:1000;letter-spacing:.15em;margin:7px}.top{height:150px;background:radial-gradient(circle,#4a1017,#08090b 70%);border:3px solid #111;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.game{font-size:15px;color:#aaa}.msg{font-size:27px;font-weight:1000;margin-top:6px}.sub{font-size:12px;color:#aaa;margin-top:5px}.reelbox{margin:12px 3px;background:#050505;border:5px solid #242424;padding:7px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.reel{height:135px;background:linear-gradient(#ddd,#fff 45%,#ddd);overflow:hidden;position:relative;border-radius:3px;color:#111}.strip{position:absolute;width:100%;top:-45px;text-align:center}.sym{height:75px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:1000;border-bottom:1px solid #bbb}.panel{background:#111;border:2px solid #333;border-radius:8px;padding:10px}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.stop{height:58px;border-radius:50%;border:4px solid #777;background:radial-gradient(circle,#f3f3f3,#999);font-weight:900}.lever{width:100%;height:62px;border:0;border-radius:12px;background:linear-gradient(#d72b3d,#8e0714);color:#fff;font-size:22px;font-weight:1000;box-shadow:0 5px 0 #50040a}.lever:disabled{opacity:.4}.stats{display:flex;justify-content:space-around;margin-top:9px;font-size:12px;color:#aaa}.stats b{display:block;color:#fff;font-size:18px;text-align:center}
.freeze{position:fixed;inset:0;background:#000;z-index:30;display:none;align-items:center;justify-content:center;flex-direction:column}.freeze.on{display:flex;animation:flash .12s steps(2) 4}.freeze .b{font-size:55px;font-weight:1000;color:#e51c34;text-shadow:0 0 28px #f22}.kaneki{position:fixed;inset:0;background:#000;z-index:29;display:none;align-items:center;justify-content:center}.kaneki.on{display:flex;animation:reveal .45s ease-out}.kaneki img{width:100%;height:100%;object-fit:cover}.kaneki .caption{position:absolute;bottom:8%;font-size:30px;font-weight:1000;text-shadow:0 2px 10px #000;color:white}@keyframes flash{50%{background:#350006;filter:brightness(2)}}@keyframes reveal{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:scale(1)}}
</style></head><body>
<div id="freeze" class="freeze"><div>REMINISCENCE</div><div class="b">FREEZE</div><div>AT 当選</div></div>
<div id="kaneki" class="kaneki"><img src="wide_dramatic_anime_illustration_scene_close_up_o.png"><div class="caption">僕の番</div></div>
<div class="wrap"><div class="cab"><div class="logo">REMINISCENCE</div><div class="top"><div id="game" class="game">0 / 8 G</div><div id="msg" class="msg">レバーON</div><div id="sub" class="sub">8G以内にATを掴め</div></div>
<div class="reelbox"><div class="reel"><div id="r1" class="strip"></div></div><div class="reel"><div id="r2" class="strip"></div></div><div class="reel"><div id="r3" class="strip"></div></div></div>
<div class="panel"><div class="buttons"><button class="stop">● STOP</button><button class="stop">● STOP</button><button class="stop">● STOP</button></div><button id="lever" class="lever" onclick="spin()">レバーON</button><div class="stats"><span>挑戦<b id="tries">0</b></span><span>AT<b id="wins">0</b></span><span>実測<b id="rate">--</b></span></div></div></div></div>
<script>
const symbols=['リプレイ','ベル','ベル','ベル','弱チェ','スイカ','ベル','リプレイ','チャンス目'];for(let i=1;i<=3;i++)document.getElementById('r'+i).innerHTML=symbols.map(x=>`<div class="sym">${x}</div>`).join('');
const P={diag:1/131.1,wc:1/70.3,sw:1/100.5,ca:1/585.1,cb:1/585.1,sc:1/356.2,cc:1/16384,kui:1/2048,push:.625};let g=0,active=false,T=0,W=0,busy=false;
function draw(){let r=Math.random(),c=0,a=[['確定チェリー',P.cc],['喰揃い',P.kui],['チャンス目',P.ca+P.cb],['強チェリー',P.sc],['弱チェリー',P.wc],['スイカ',P.sw],['斜めベル',P.diag],['押し順ベル',P.push]];for(let x of a){c+=x[1];if(r<c)return x[0]}return'リプレイ'}function hp(x,n){if(['確定チェリー','喰揃い','チャンス目','強チェリー'].includes(x))return 1;if(['弱チェリー','スイカ'].includes(x))return n===8?1:.4061;if(['斜めベル','押し順ベル'].includes(x))return .1094;return .0005}
function rs(x){if(x.includes('チェリー'))return'弱チェ';if(x==='スイカ')return'スイカ';if(x.includes('ベル'))return'ベル';if(x==='チャンス目'||x==='喰揃い')return'チャンス目';return'リプレイ'}
function spin(){if(busy)return;if(!active){active=true;g=0;T++}g++;busy=true;lever.disabled=true;msg.textContent='回転中…';game.textContent=`${g} / 8 G`;let role=draw(),hit=Math.random()<hp(role,g),base=rs(role);for(let i=1;i<=3;i++){let el=document.getElementById('r'+i);el.style.transition='none';el.style.transform='translateY(-420px)';setTimeout(()=>{el.style.transition=`transform ${.38+i*.1}s cubic-bezier(.1,.7,.2,1)`;el.style.transform=`translateY(${symbols.indexOf(base)*-75+45}px)`},20)}setTimeout(()=>{busy=false;lever.disabled=false;msg.textContent=role;sub.textContent=`AT抽選 ${(hp(role,g)*100).toFixed(2)}%`;if(hit){W++;active=false;update();showWin()}else if(g===8){active=false;msg.textContent='レミニセンス失敗';sub.textContent='次のレバーONで再挑戦'}else sub.textContent+=' → 非当選';update()},850)}
function showWin(){busy=true;lever.disabled=true;freeze.classList.add('on');setTimeout(()=>{freeze.classList.remove('on');kaneki.classList.add('on')},1400);setTimeout(()=>{kaneki.classList.remove('on');msg.textContent='AT 当選';sub.textContent='次のレバーONで再挑戦';busy=false;lever.disabled=false},4300)}
function update(){tries.textContent=T;wins.textContent=W;rate.textContent=T?(W/T*100).toFixed(1)+'%':'--'}
</script></body></html>
