<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#19051f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ラブパチ♡ 1/35</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#100315;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
body{background:radial-gradient(circle at 50% 10%,#6d1e75 0,#2b0a39 33%,#0d0312 75%);overflow-x:hidden}
#app{max-width:540px;min-height:100vh;margin:auto;padding:12px 12px calc(26px + env(safe-area-inset-bottom))}
.hero{height:300px;position:relative;overflow:hidden;border-radius:24px;border:2px solid #ff76d8;box-shadow:0 0 24px #ff4fc066}
.hero img{width:100%;height:100%;object-fit:cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,#170219e8)}
.brand{position:absolute;z-index:2;left:0;right:0;bottom:12px;font-size:25px;font-weight:1000;text-shadow:0 2px 5px #000,0 0 14px #ff43c7}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:11px 0}
.card{background:#17091ee8;border:1px solid #754087;border-radius:15px;padding:10px}
.label{font-size:12px;color:#eac8ef}.num{font-size:30px;font-weight:1000}
#draw{position:relative;width:100%;border:0;border-radius:23px;padding:20px 8px;background:linear-gradient(#ff87df,#e91e8c);color:white;font-size:28px;font-weight:1000;box-shadow:0 6px 0 #941452,0 0 22px #ff4bc177;touch-action:manipulation}
#draw:active{transform:translateY(4px);box-shadow:0 2px 0 #941452,0 0 28px #ff4bc1}
#draw:disabled{opacity:.5}
.odds{font-size:12px;color:#e7c6ea;margin:11px 0}
#status{font-weight:900;min-height:28px;font-size:19px}
.history{margin-top:9px;min-height:60px;background:#16091d;border:1px solid #5c356a;border-radius:15px;padding:9px;display:flex;gap:5px;align-content:flex-start;flex-wrap:wrap}
.ball{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:#41244a;font-size:11px}
.ball.hot{background:#ff2a9e;box-shadow:0 0 15px #ff2a9e}
.ball.hit{background:#ffe04f;color:#551242;font-weight:1000;box-shadow:0 0 18px #ffe04f}
.controls{display:flex;justify-content:center;margin-top:10px}
.smallbtn{border:1px solid #795087;background:#291430;color:#fff;border-radius:12px;padding:9px 18px;font-weight:800}
#flash{position:fixed;z-index:50;inset:0;pointer-events:none;background:white;opacity:0}
#flash.go{animation:flash .75s ease-out}
@keyframes flash{0%{opacity:1}30%{opacity:.9;background:#ff3ac8}100%{opacity:0}}
#win{display:none;position:fixed;z-index:40;inset:0;background:#110014f2;align-items:center;justify-content:center;padding:14px}
#win.show{display:flex}
.winbox{position:relative;width:min(100%,520px);max-height:94vh;overflow:hidden;border-radius:27px;border:3px solid #ffdc52;background:#25052a;box-shadow:0 0 70px #ffcf31,0 0 35px #ff35c5}
.winbox img{display:block;width:100%;height:55vh;object-fit:cover}
.wincontent{position:absolute;inset:auto 0 0;padding:90px 14px 20px;background:linear-gradient(transparent,#160018 33%)}
.winTitle{font-size:55px;font-weight:1000;color:#fff4a5;text-shadow:0 0 9px #ff20bb,3px 3px 0 #a61168;animation:pulse .55s infinite alternate}
@keyframes pulse{to{transform:scale(1.05)}}
#payout{font-size:65px;font-weight:1000;color:#ffdf57}
#again{width:72%;border:0;border-radius:16px;padding:13px;background:#ff5dc4;color:white;font-size:18px;font-weight:1000}
#miss{display:none;position:fixed;z-index:45;inset:0;background:#09020de8;align-items:center;justify-content:center;padding:20px}
#miss.show{display:flex}.missbox{background:#211026;border:1px solid #7c5686;border-radius:22px;padding:25px;width:min(100%,430px)}
.missbig{font-size:35px;font-weight:1000}.muted{color:#c9accf;font-size:13px}
#retry{margin-top:16px;border:0;border-radius:15px;padding:13px 24px;background:#ff62c8;color:#fff;font-size:17px;font-weight:900}
.spark{position:fixed;z-index:60;pointer-events:none;font-size:28px;animation:burst 1.1s ease-out forwards}
@keyframes burst{from{transform:translate(0,0) scale(.2);opacity:1}to{transform:translate(var(--x),var(--y)) rotate(200deg) scale(1.6);opacity:0}}
</style>
</head>
<body>
<div id="app">
 <div class="hero"><img src="hero.png" alt=""><div class="brand">きみとつながる ラブパチ♡</div></div>
 <div class="stats">
   <div class="card"><div class="label">現在の回転数</div><div class="num"><span id="spins">0</span>/35</div></div>
   <div class="card"><div class="label">獲得総出玉</div><div class="num"><span id="total">0</span>発</div></div>
 </div>
 <div id="status">君の1タップで運命が決まる♡</div>
 <button id="draw" type="button">♡ 抽選する</button>
 <div class="odds">毎回 1/35 ｜ 当たり時 240発：800発 ＝ 1：2</div>
 <div id="history" class="history"></div>
 <div class="controls"><button id="reset" class="smallbtn" type="button">総出玉もリセット</button></div>
</div>
<div id="flash"></div>
<div id="win"><div class="winbox">
 <img src="hero.png" alt="">
 <div class="wincontent">
  <div class="winTitle">当たり!!</div>
  <div>獲得出玉</div><div><span id="payout">800</span> 発</div>
  <button id="again" type="button">次の35回へ♡</button>
 </div>
</div></div>
<div id="miss"><div class="missbox">
 <div class="missbig">35回転スルー…</div>
 <p class="muted">今回は当たりを引けなかった。</p>
 <button id="retry" type="button">次の35回へ</button>
</div></div>
<script>
(()=> {
 let spins=0,total=0,locked=false;
 const q=s=>document.querySelector(s);
 const draw=q("#draw"), history=q("#history"), status=q("#status");
 let audio=null;
 function ctx(){ if(!audio) audio=new (window.AudioContext||window.webkitAudioContext)(); if(audio.state==="suspended")audio.resume(); return audio; }
 function tone(freq,dur,type="sine",vol=.05,delay=0){
   try{const a=ctx(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(a.destination);
   const t=a.currentTime+delay;o.start(t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.stop(t+dur);}catch(e){}
 }
 function tapSound(){tone(330,.055,"square",.025);tone(510,.05,"square",.018,.045)}
 function winSound(){[523,659,784,1047,1319].forEach((n,i)=>tone(n,.35,"square",.045,i*.08))}
 function update(){q("#spins").textContent=spins;q("#total").textContent=total;draw.disabled=locked}
 function addBall(kind){
   const b=document.createElement("span");b.className="ball "+(kind||"");b.textContent=kind==="hit"?"当":spins;history.appendChild(b);
 }
 function particles(){
   const c=["♡","♥","★","✦","✧"];
   for(let i=0;i<50;i++){let s=document.createElement("div");s.className="spark";s.textContent=c[(Math.random()*c.length)|0];
   s.style.left=(45+Math.random()*10)+"vw";s.style.top=(45+Math.random()*10)+"vh";
   s.style.setProperty("--x",(Math.random()*720-360)+"px");s.style.setProperty("--y",(Math.random()*720-360)+"px");
   document.body.appendChild(s);setTimeout(()=>s.remove(),1200)}
 }
 function newRound(){spins=0;locked=false;history.innerHTML="";status.textContent="君の1タップで運命が決まる♡";q("#win").classList.remove("show");q("#miss").classList.remove("show");update()}
 function jackpot(){
   locked=true; const p=Math.random()<1/3?240:800; total+=p; q("#payout").textContent=p; addBall("hit"); update();
   status.textContent="！！！ 当たり ！！！";
   const f=q("#flash");f.classList.remove("go");void f.offsetWidth;f.classList.add("go");
   winSound(); if(navigator.vibrate)navigator.vibrate([80,35,120,35,220]); particles();
   setTimeout(()=>q("#win").classList.add("show"),250);
 }
 function spin(){
   if(locked)return; tapSound(); spins++;
   const hit=Math.floor(Math.random()*35)===0;
   if(hit){jackpot();return}
   addBall("");
   if(spins===34)status.textContent="あと1回……！";
   else if(spins>=35){locked=true;status.textContent="35回転終了";update();setTimeout(()=>q("#miss").classList.add("show"),250)}
   else status.textContent=spins+"回転目…ハズレ";
   update();
 }
 draw.addEventListener("click",spin);
 q("#again").addEventListener("click",newRound);
 q("#retry").addEventListener("click",newRound);
 q("#reset").addEventListener("click",()=>{total=0;newRound()});
 update();
})();
</script>
</body></html>
