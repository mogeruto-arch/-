<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>REMINISCENCE</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#070507;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;overflow-x:hidden}
.app{max-width:520px;margin:auto;min-height:100vh;background:radial-gradient(circle at 50% 0,#38040c 0,#0b070a 35%,#050506 100%);padding:10px}
.logo{text-align:center;font-size:25px;font-weight:1000;letter-spacing:.13em;text-shadow:0 0 12px #f22;margin:4px 0 8px}
.info{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px}.box{border:1px solid #71202d;background:#10090c;border-radius:7px;text-align:center;padding:7px 3px}.lab{font-size:10px;color:#bcaeb2}.val{font-size:18px;font-weight:900;margin-top:2px}
.reels{height:390px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:#12080b;border:4px solid #2d2023;border-radius:8px;padding:5px;overflow:hidden;position:relative;box-shadow:inset 0 0 25px #000}
.reels:after{content:"";position:absolute;left:4px;right:4px;top:50%;height:86px;transform:translateY(-50%);border-top:2px solid #e31c36;border-bottom:2px solid #e31c36;box-shadow:0 0 13px #d4142c;pointer-events:none}
.reel{background:#f6eee9;overflow:hidden;position:relative;border:2px solid #4b3437}.strip{position:absolute;left:0;width:100%;will-change:transform}.sym{height:86px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #d7c8c2;font-weight:1000;text-align:center;position:relative}
.ico{width:74%;height:62px;border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px #0005;font-size:20px;text-shadow:0 1px 1px #fff8}
.ベル .ico{background:linear-gradient(#ffe861,#d79c00);color:#6e4300;border:3px solid #b77b00}.青 .ico{background:radial-gradient(circle,#dffaff,#4fc4f4 55%,#0878bf);color:#fff;border:3px solid #169ad3}.チェリー .ico{background:radial-gradient(circle,#ff6b70,#a90010);color:#fff;border:3px solid #5e0010}.スイカ .ico{background:linear-gradient(135deg,#258c32 0 28%,#e52d42 29% 70%,#258c32 71%);color:#fff;border:3px solid #155f22}.赫 .ico{background:radial-gradient(circle,#ed2338,#60000b);color:#fff;border:3px solid #2d0006}.金木 .ico{background:linear-gradient(135deg,#fff,#c8c8c8);color:#171717;border:3px solid #444}.喰種 .ico{background:#111;color:#fff;border:3px solid #555;font-size:16px}.喰 .ico{background:radial-gradient(circle,#ff3ea4,#750044);color:#fff;border:3px solid #4c002c;font-size:30px}.白 .ico{background:linear-gradient(135deg,#555,#111);color:#eee;border:3px solid #222}
.status{height:66px;margin:9px 0 7px;border:1px solid #6f202d;background:#10080b;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}.role{font-size:20px;font-weight:1000}.detail{font-size:11px;color:#baaeb2;margin-top:3px}
.stops{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:4px 18px}.stop{aspect-ratio:1;border-radius:50%;border:5px solid #6f6f72;background:radial-gradient(circle,#ff515d 0 45%,#a30d1b 48% 70%,#4b070d 72%);box-shadow:0 4px 0 #222,0 0 13px #e01c33;color:#fff;font-weight:1000;font-size:12px}.stop:disabled{filter:grayscale(1);opacity:.45}
.lever{width:100%;height:61px;margin-top:10px;border:0;border-radius:10px;background:linear-gradient(#e33143,#8c0714);box-shadow:0 5px 0 #4b0309;color:#fff;font-size:21px;font-weight:1000}.lever:disabled{opacity:.4}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.stats .box{padding:6px}.stats .val{font-size:16px}
.overlay{position:fixed;inset:0;z-index:50;display:none;background:#000;align-items:center;justify-content:center;flex-direction:column}.overlay.on{display:flex}.freeze.on{animation:flash .11s steps(2) 7}.freeze .big{font-size:52px;font-weight:1000;color:#e51d36;text-shadow:0 0 25px #f22}.freeze .small{letter-spacing:.5em;color:#aaa;margin-bottom:10px}.kaneki img{width:100%;height:100%;object-fit:cover}.kaneki .txt{position:absolute;bottom:8%;font-size:34px;font-weight:1000;text-shadow:0 3px 15px #000}.crack{position:absolute;font-size:42px;left:10%;top:36%;transform:rotate(-15deg);font-weight:1000;text-shadow:0 0 8px #000}
@keyframes flash{50%{background:#4b000b;filter:brightness(2.2)}}
</style></head><body>

<script>
const reels=[["ベル", "青", "金木", "チェリー", "スイカ", "ベル", "青", "喰種", "チェリー", "スイカ", "ベル", "青", "喰", "赫", "スイカ", "ベル", "青", "白", "チェリー", "スイカ"], ["ベル", "チェリー", "金木", "青", "赫", "ベル", "スイカ", "喰種", "青", "赫", "ベル", "スイカ", "喰", "青", "赫", "ベル", "チェリー", "白", "青", "赫"], ["スイカ", "赫", "金木", "青", "ベル", "スイカ", "赫", "喰種", "青", "ベル", "スイカ", "赫", "喰", "青", "ベル", "スイカ", "赫", "白", "青", "ベル"]];
const H=86, VIEW=390;
const P={diag:1/131.1,wc:1/70.3,sw:1/100.5,ca:1/585.1,cb:1/585.1,sc:1/356.2,cc:1/16384,kui:1/2048,push:.625};
let g=0,active=false,T=0,W=0,spinning=false,stopped=[true,true,true],roleNow='',hitNow=false,targets=[0,0,0],timers=[];
function cls(x){return x}
function label(x){return {青:'REPLAY',赫:'赫',金木:'金木',喰種:'東京喰種',喰:'喰',白:'白7'}[x]||x}
function build(){
 reels.forEach((arr,i)=>{let doubled=arr.concat(arr,arr);document.getElementById('s'+i).innerHTML=doubled.map(x=>`<div class="sym ${cls(x)}"><div class="ico">${label(x)}</div></div>`).join(''); setPos(i,7,false)})
}
function setPos(i,idx,anim=true){let y=VIEW/2-H/2-(idx+20)*H;let e=document.getElementById('s'+i);e.style.transition=anim?'transform .28s cubic-bezier(.1,.8,.2,1)':'none';e.style.transform=`translateY(${y}px)`}
function drawRole(){let r=Math.random(),c=0,a=[['確定チェリー',P.cc],['喰揃い',P.kui],['チャンス目A',P.ca],['チャンス目B',P.cb],['強チェリー',P.sc],['弱チェリー',P.wc],['スイカ',P.sw],['斜めベル',P.diag],['押し順ベル',P.push]];for(let x of a){c+=x[1];if(r<c)return x[0]}return'リプレイ'}
function hp(x,n){if(['確定チェリー','喰揃い','チャンス目A','チャンス目B','強チェリー'].includes(x))return 1;if(['弱チェリー','スイカ'].includes(x))return n===8?1:.4061;if(['斜めベル','押し順ベル'].includes(x))return .1094;return .0005}
function candidates(arr,s){let a=[];arr.forEach((x,i)=>{if(x===s)a.push(i)});return a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function makeTargets(role){
 // Deliberately avoid nonsensical all-reel "same role" displays. Build plausible-looking slot stops from the actual reel arrays.
 if(role==='リプレイ'){return [pick(candidates(reels[0],'青')),pick(candidates(reels[1],'青')),pick(candidates(reels[2],'青'))]}
 if(role==='押し順ベル'||role==='斜めベル'){return [pick(candidates(reels[0],'ベル')),pick(candidates(reels[1],'ベル')),pick(candidates(reels[2],'ベル'))]}
 if(role==='弱チェリー'||role==='強チェリー'){return [pick(candidates(reels[0],'チェリー')),pick(candidates(reels[1],'青')),pick(candidates(reels[2],'ベル'))]}
 if(role==='スイカ'){return [pick(candidates(reels[0],'スイカ')),pick(candidates(reels[1],'スイカ')),pick(candidates(reels[2],'スイカ'))]}
 if(role.startsWith('チャンス目')){return [pick(candidates(reels[0],'赫')),pick(candidates(reels[1],'青')),pick(candidates(reels[2],'赫'))]}
 if(role==='喰揃い'){return [pick(candidates(reels[0],'喰')),pick(candidates(reels[1],'喰')),pick(candidates(reels[2],'喰'))]}
 if(role==='確定チェリー'){return [pick(candidates(reels[0],'チェリー')),pick(candidates(reels[1],'金木')),pick(candidates(reels[2],'金木'))]}
 return [1,2,3]
}
function leverOn(){
 if(spinning)return;
 if(!active){active=true;g=0;T++}
 g++; remain.textContent=(8-g)+'G'; roleNow=drawRole(); hitNow=Math.random()<hp(roleNow,g); targets=makeTargets(roleNow); stopped=[false,false,false]; spinning=true;
 role.textContent='回転中…'; roleTop.textContent='???'; prob.textContent='???'; detail.textContent='停止ボタンを押せ';
 lever.disabled=true;
 for(let i=0;i<3;i++){document.getElementById('b'+i).disabled=false; let e=document.getElementById('s'+i); e.style.transition='none'; let pos=0; timers[i]=setInterval(()=>{pos=(pos+1)%20;setPos(i,pos,false)},55)}
}
function stopReel(i){
 if(!spinning||stopped[i])return; clearInterval(timers[i]); stopped[i]=true; setPos(i,targets[i],true); document.getElementById('b'+i).disabled=true;
 if(stopped.every(Boolean))setTimeout(resolve,340)
}
function resolve(){
 spinning=false; lever.disabled=false; role.textContent=roleNow; roleTop.textContent=roleNow.replace('チェリー','チェ').replace('押し順','押順'); let p=hp(roleNow,g);prob.textContent=(p*100).toFixed(p<.01?2:2)+'%';
 if(hitNow){W++;active=false;update();showWin();return}
